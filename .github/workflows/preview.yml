name: PR Preview

on:
  push:
    branches-ignore:
      - main

jobs:
  preview:
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      contents: read
      deployments: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build

      # The newsroom lists token is loaded but not used here. It is the
      # deploy job that writes it to the Pages project, for both
      # environments; reading it on a PR is what catches a broken reference
      # before main does.
      - uses: 1password/install-cli-action@1a3160d5e9de1ae0803eaa08a88746f5ae3daa50 # v4.1.0
        with:
          version: 2.42.0

      - name: Load secrets from 1Password
        shell: bash
        env:
          OP_SERVICE_ACCOUNT_TOKEN: ${{ secrets.OP_SERVICE_ACCOUNT_TOKEN }}
          NEWSROOM_LISTS_TOKEN: op://TSE Systems/gregory.sh - the-newsroom-lists bearer token/token
        run: |
          set -euo pipefail
          names=()
          while IFS= read -r -d '' entry; do
            case "${entry#*=}" in op://*) names+=("${entry%%=*}") ;; esac
          done < <(env -0)
          [ "${#names[@]}" -gt 0 ] || { echo "::error::No op:// reference in this step's env"; exit 1; }
          cat >"${RUNNER_TEMP}/export-secrets.sh" <<'EOF'
          set -euo pipefail
          for name in "$@"; do
            [ -n "${!name:-}" ] || { echo "::error::1Password returned an empty value for ${name}"; exit 1; }
          done
          delimiter="ghadelimiter_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          for name in "$@"; do
            while IFS= read -r line; do
              line="${line%$'\r'}"
              case "${line}" in *[![:space:]]*) ;; *) continue ;; esac
              line="${line//%/%25}"
              printf '::add-mask::%s\n' "${line//$'\r'/%0D}"
            done <<<"${!name}"
          done
          for name in "$@"; do
            printf '%s<<%s\n%s\n%s\n' "${name}" "${delimiter}" "${!name}" "${delimiter}"
          done >>"${GITHUB_ENV}"
          EOF
          op run --no-masking --cache=false -- bash "${RUNNER_TEMP}/export-secrets.sh" "${names[@]}"

      - name: Deploy preview to Cloudflare Pages
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy --branch=${{ github.ref_name }} --commit-dirty=true

      - name: Validate preview health
        env:
          BASE_URL: ${{ steps.deploy.outputs.deployment-url }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          for endpoint in livez healthz; do
            status=''
            for attempt in $(seq 1 10); do
              status=$(curl --max-time 10 --silent --show-error --output "$endpoint.body" --write-out '%{http_code}' "$BASE_URL/$endpoint" || true)
              [ "$status" = 200 ] && break
              [ "$attempt" = 10 ] && { echo "$endpoint returned $status"; exit 1; }
              sleep 2
            done
          done
          node vendor/health-contract/scripts/validate-health.mjs healthz.body --http-status 200
          node -e 'const h=JSON.parse(require("fs").readFileSync("healthz.body")); if(h.status!=="pass"||h.serviceId!=="gregory-sh-web"||h.version!==process.argv[1]) process.exit(1)' "$RELEASE_SHA"

      - name: Find PR for this branch
        id: find-pr
        run: |
          PR_NUMBER=$(gh pr list --head "${{ github.ref_name }}" --json number --jq '.[0].number // empty')
          echo "pr_number=$PR_NUMBER" >> $GITHUB_OUTPUT
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Find existing comment
        if: steps.find-pr.outputs.pr_number
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ steps.find-pr.outputs.pr_number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- cf-pages-preview -->'

      - name: Post or update preview comment
        if: steps.find-pr.outputs.pr_number
        uses: peter-evans/create-or-update-comment@v4
        with:
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          issue-number: ${{ steps.find-pr.outputs.pr_number }}
          edit-mode: replace
          body: |
            <!-- cf-pages-preview -->
            ## Preview Deployment

            | Status | URL |
            |--------|-----|
            | Ready | ${{ steps.deploy.outputs.deployment-url }} |

            **Branch:** `${{ github.ref_name }}`
            **Commit:** `${{ github.sha }}`

            ---
            <sub>This preview will be updated on each push to this branch.</sub>
